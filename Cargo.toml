[package]
name = "tibia-net-optimizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
description = "Windows tray utility that tunes TCP settings (auto-tuning, Nagle) for low-latency Tibia play"
readme = "README.md"

# Sprint 1 keeps dependencies minimal: only what the domain core + Windows
# adapters need. GUI/tray crates (eframe, egui, tray-icon, image) and the
# `windows` crate are added in the sprints that introduce those features.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Raw Win32 bindings (lighter than the `windows` crate suggested in the spec).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
